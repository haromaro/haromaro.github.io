<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0">

    <title>주문 관리</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Noto Sans KR",
                "Malgun Gothic",
                sans-serif;

            background: #f5f6f8;

            color: #222;

            min-height: 100vh;

        }


        /* ========================================
           상단
        ======================================== */

        .header {

            height: 75px;

            background: #222;

            color: white;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 30px;

        }


        .header h1 {

            font-size: 26px;

        }


        .header-buttons {

            display: flex;

            gap: 10px;

        }


        .header button {

            border: none;

            background: #444;

            color: white;

            padding: 11px 18px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 15px;

        }


        /* ========================================
           전체 영역
        ======================================== */

        .container {

            max-width: 1400px;

            margin: auto;

            padding: 30px;

        }


        /* ========================================
           통계
        ======================================== */

        .summary {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 20px;

            margin-bottom: 30px;

        }


        .summary-card {

            background: white;

            border-radius: 15px;

            padding: 22px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.05);

        }


        .summary-title {

            color: #777;

            font-size: 15px;

            margin-bottom: 10px;

        }


        .summary-value {

            font-size: 30px;

            font-weight: bold;

        }


        /* ========================================
           주문 목록
        ======================================== */

        .order-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 15px;

        }


        .order-header h2 {

            font-size: 24px;

        }


        .refresh-info {

            color: #888;

            font-size: 14px;

        }


        .order-list {

            display: flex;

            flex-direction: column;

            gap: 15px;

        }


        /* ========================================
           주문 카드
        ======================================== */

        .order-card {

            background: white;

            border-radius: 15px;

            padding: 22px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.05);

        }


        .order-card-top {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 15px;

        }


        .order-number {

            font-size: 19px;

            font-weight: bold;

        }


        .order-time {

            color: #888;

            font-size: 14px;

            margin-top: 5px;

        }


        /* ========================================
           상태
        ======================================== */

        .status {

            display: inline-block;

            padding: 8px 14px;

            border-radius: 20px;

            font-size: 14px;

            font-weight: bold;

        }


        .status-received {

            background: #fff3cd;

            color: #856404;

        }


        .status-cooking {

            background: #cfe2ff;

            color: #084298;

        }


        .status-completed {

            background: #d1e7dd;

            color: #0f5132;

        }


        /* ========================================
           주문 메뉴
        ======================================== */

        .order-items {

            border-top: 1px solid #eee;

            border-bottom: 1px solid #eee;

            padding: 12px 0;

            margin-bottom: 15px;

        }


        .order-item {

            display: flex;

            justify-content: space-between;

            padding: 7px 0;

        }


        .order-item-name {

            font-weight: 500;

        }


        .order-item-quantity {

            color: #777;

            margin-left: 8px;

        }


        .order-item-price {

            color: #555;

        }


        /* ========================================
           주문 하단
        ======================================== */

        .order-bottom {

            display: flex;

            justify-content: space-between;

            align-items: center;

        }


        .total-price {

            font-size: 21px;

            font-weight: bold;

        }


        /* ========================================
           상태 변경 버튼
        ======================================== */

        .action-buttons {

            display: flex;

            gap: 8px;

            flex-wrap: wrap;

        }


        .action-button {

            border: none;

            border-radius: 8px;

            padding: 10px 15px;

            cursor: pointer;

            font-size: 14px;

        }


        .receive-button {

            background: #fff3cd;

            color: #856404;

        }


        .cooking-button {

            background: #cfe2ff;

            color: #084298;

        }


        .complete-button {

            background: #d1e7dd;

            color: #0f5132;

        }


        .delete-button {

            background: #f8d7da;

            color: #842029;

        }


        /* ========================================
           빈 주문
        ======================================== */

        .empty {

            background: white;

            border-radius: 15px;

            padding: 70px 20px;

            text-align: center;

            color: #999;

        }


        .empty-icon {

            font-size: 60px;

            margin-bottom: 15px;

        }


        /* ========================================
           로딩
        ======================================== */

        .loading {

            background: white;

            border-radius: 15px;

            padding: 50px;

            text-align: center;

            color: #777;

        }


        /* ========================================
           태블릿
        ======================================== */

        @media (max-width: 800px) {

            .container {

                padding: 15px;

            }


            .summary {

                grid-template-columns:
                    repeat(2, 1fr);

            }


            .order-card-top {

                align-items: flex-start;

            }


            .order-bottom {

                flex-direction: column;

                align-items: stretch;

                gap: 15px;

            }


            .action-buttons {

                width: 100%;

            }


            .action-button {

                flex: 1;

            }

        }


        @media (max-width: 500px) {

            .header {

                padding: 0 15px;

            }


            .header h1 {

                font-size: 20px;

            }


            .header button {

                padding: 9px 12px;

            }


            .summary-value {

                font-size: 24px;

            }

        }

    </style>

</head>


<body>


<!-- ==========================================
     상단
========================================== -->

<header class="header">


    <h1>
        주문 관리
    </h1>


    <div class="header-buttons">


        <button
            onclick="location.href='index.html'">

            처음으로

        </button>


        <button
            onclick="location.href='kiosk.html'">

            주문 화면

        </button>


    </div>


</header>



<!-- ==========================================
     본문
========================================== -->

<main class="container">


    <!-- ======================================
         통계
    ======================================= -->

    <section class="summary">


        <div class="summary-card">

            <div class="summary-title">
                전체 주문
            </div>

            <div
                class="summary-value"
                id="totalOrders">

                0

            </div>

        </div>



        <div class="summary-card">

            <div class="summary-title">
                접수
            </div>

            <div
                class="summary-value"
                id="receivedOrders">

                0

            </div>

        </div>



        <div class="summary-card">

            <div class="summary-title">
                조리중
            </div>

            <div
                class="summary-value"
                id="cookingOrders">

                0

            </div>

        </div>



        <div class="summary-card">

            <div class="summary-title">
                완료
            </div>

            <div
                class="summary-value"
                id="completedOrders">

                0

            </div>

        </div>

    </section>



    <!-- ======================================
         주문 목록
    ======================================= -->

    <section>


        <div class="order-header">


            <h2>
                주문 목록
            </h2>


            <div
                class="refresh-info">

                ● 실시간 업데이트

            </div>


        </div>



        <div
            id="orderList"
            class="order-list">

            <div class="loading">

                주문 정보를 불러오는 중...

            </div>

        </div>


    </section>


</main>



<!-- ==========================================
     Firebase
========================================== -->

<script type="module">


    /* ========================================
       Firebase SDK
    ======================================== */

    import {
        initializeApp
    }
    from
    "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


    import {
        getFirestore,

        collection,

        query,

        orderBy,

        onSnapshot,

        updateDoc,

        deleteDoc,

        doc

    }
    from
    "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";



    /* ========================================
       Firebase 설정
    ======================================== */

    const firebaseConfig = {
  apiKey: "AIzaSyC2v0pHovB28AqgxA2rByTyCleCcD7JXuw",
  authDomain: "kiosk-2ca4b.firebaseapp.com",
  projectId: "kiosk-2ca4b",
  storageBucket: "kiosk-2ca4b.firebasestorage.app",
  messagingSenderId: "970714057142",
  appId: "1:970714057142:web:dcbc9b46856830502d1917"

    };



    /* Firebase 초기화 */

    const app =
        initializeApp(
            firebaseConfig
        );


    const db =
        getFirestore(app);



    /* ========================================
       주문 데이터
    ======================================== */

    let orders = [];



    /* ========================================
       Firestore 실시간 주문 감시
    ======================================== */

    const ordersQuery = query(

        collection(
            db,
            "orders"
        ),

        orderBy(
            "createdAt",
            "desc"
        )

    );


    onSnapshot(

        ordersQuery,

        snapshot => {


            orders = [];


            snapshot.forEach(
                documentSnapshot => {


                    orders.push({

                        id:
                            documentSnapshot.id,

                        ...documentSnapshot.data()

                    });

                }
            );


            renderOrders();


            updateSummary();

        },


        error => {


            console.error(
                "주문 불러오기 실패:",
                error
            );


            document
                .getElementById(
                    "orderList"
                )
                .innerHTML = `

                    <div class="empty">

                        주문 정보를
                        불러오지 못했습니다.

                        <br><br>

                        Firebase 설정과
                        Firestore 규칙을
                        확인해주세요.

                    </div>

                `;

        }

    );



    /* ========================================
       주문 목록 출력
    ======================================== */

    function renderOrders() {


        const orderList =
            document.getElementById(
                "orderList"
            );


        orderList.innerHTML = "";


        if (orders.length === 0) {


            orderList.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        📋
                    </div>

                    현재 주문이 없습니다.

                </div>

            `;


            return;

        }



        orders.forEach(order => {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "order-card";


            /* 주문 상태 */

            const status =
                order.status ||
                "접수";


            let statusClass =
                "status-received";


            if (
                status === "조리중"
            ) {

                statusClass =
                    "status-cooking";

            }


            if (
                status === "완료"
            ) {

                statusClass =
                    "status-completed";

            }



            /* 주문 시간 */

            let orderTime =
                "시간 정보 없음";


            if (
                order.createdAt
            ) {


                const date =
                    order.createdAt.toDate();


                orderTime =
                    formatDate(date);

            }



            /* 메뉴 */

            let itemsHTML = "";


            if (
                order.items &&
                order.items.length > 0
            ) {


                order.items.forEach(
                    item => {


                        itemsHTML += `

                            <div
                                class="order-item">

                                <div>

                                    <span
                                        class="order-item-name">

                                        ${item.name}

                                    </span>


                                    <span
                                        class="order-item-quantity">

                                        × ${item.quantity}

                                    </span>

                                </div>


                                <div
                                    class="order-item-price">

                                    ${Number(item.total)
                                        .toLocaleString()}원

                                </div>

                            </div>

                        `;

                    }
                );

            }



            /* 버튼 */

            const buttonsHTML = `

                <div class="action-buttons">


                    <button
                        class="action-button receive-button"
                        onclick="changeStatus('${order.id}', '접수')">

                        접수

                    </button>


                    <button
                        class="action-button cooking-button"
                        onclick="changeStatus('${order.id}', '조리중')">

                        조리중

                    </button>


                    <button
                        class="action-button complete-button"
                        onclick="changeStatus('${order.id}', '완료')">

                        완료

                    </button>


                    <button
                        class="action-button delete-button"
                        onclick="deleteOrder('${order.id}')">

                        삭제

                    </button>

                </div>

            `;



            card.innerHTML = `


                <div class="order-card-top">


                    <div>


                        <div class="order-number">

                            주문번호
                            #${order.id.substring(0, 6).toUpperCase()}

                        </div>


                        <div class="order-time">

                            ${orderTime}

                        </div>


                    </div>


                    <div
                        class="status ${statusClass}">

                        ${status}

                    </div>


                </div>



                <div class="order-items">

                    ${itemsHTML}

                </div>



                <div class="order-bottom">


                    <div class="total-price">

                        총
                        ${Number(
                            order.totalPrice || 0
                        ).toLocaleString()}원

                    </div>


                    ${buttonsHTML}


                </div>

            `;


            orderList.appendChild(
                card
            );

        });

    }



    /* ========================================
       주문 상태 변경
    ======================================== */

    window.changeStatus =
        async function(
            orderId,
            status
        ) {


            try {


                await updateDoc(

                    doc(
                        db,
                        "orders",
                        orderId
                    ),

                    {

                        status:
                            status

                    }

                );


            }
            catch (error) {


                console.error(
                    "상태 변경 실패:",
                    error
                );


                alert(
                    "주문 상태 변경에 실패했습니다."
                );

            }

        };



    /* ========================================
       주문 삭제
    ======================================== */

    window.deleteOrder =
        async function(
            orderId
        ) {


            const answer =
                confirm(
                    "이 주문을 삭제하시겠습니까?"
                );


            if (!answer) {

                return;

            }


            try {


                await deleteDoc(

                    doc(
                        db,
                        "orders",
                        orderId
                    )

                );


            }
            catch (error) {


                console.error(
                    "주문 삭제 실패:",
                    error
                );


                alert(
                    "주문 삭제에 실패했습니다."
                );

            }

        };



    /* ========================================
       통계
    ======================================== */

    function updateSummary() {


        const total =
            orders.length;


        const received =
            orders.filter(
                order =>
                order.status === "접수"
            ).length;


        const cooking =
            orders.filter(
                order =>
                order.status === "조리중"
            ).length;


        const completed =
            orders.filter(
                order =>
                order.status === "완료"
            ).length;



        document
            .getElementById(
                "totalOrders"
            )
            .textContent =
            total;


        document
            .getElementById(
                "receivedOrders"
            )
            .textContent =
            received;


        document
            .getElementById(
                "cookingOrders"
            )
            .textContent =
            cooking;


        document
            .getElementById(
                "completedOrders"
            )
            .textContent =
            completed;

    }



    /* ========================================
       날짜 표시
    ======================================== */

    function formatDate(date) {


        const year =
            date.getFullYear();


        const month =
            String(
                date.getMonth() + 1
            ).padStart(2, "0");


        const day =
            String(
                date.getDate()
            ).padStart(2, "0");


        const hour =
            String(
                date.getHours()
            ).padStart(2, "0");


        const minute =
            String(
                date.getMinutes()
            ).padStart(2, "0");


        const second =
            String(
                date.getSeconds()
            ).padStart(2, "0");


        return `${year}-${month}-${day}
                ${hour}:${minute}:${second}`;

    }


</script>


</body>

</html>
