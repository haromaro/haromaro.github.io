<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0">

    <title>관리자 로그인</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #f5f6f8;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Noto Sans KR",
                "Malgun Gothic",
                sans-serif;

        }


        .login-box {

            width: 90%;

            max-width: 420px;

            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.08);

        }


        .login-title {

            text-align: center;

            margin-bottom: 35px;

        }


        .login-title .icon {

            font-size: 55px;

            margin-bottom: 10px;

        }


        .login-title h1 {

            font-size: 28px;

        }


        .login-title p {

            color: #888;

            margin-top: 8px;

        }


        .input-group {

            margin-bottom: 18px;

        }


        .input-group label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

        }


        .input-group input {

            width: 100%;

            padding: 15px;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 16px;

            outline: none;

        }


        .input-group input:focus {

            border-color: #222;

        }


        .login-button {

            width: 100%;

            padding: 16px;

            margin-top: 10px;

            border: none;

            border-radius: 10px;

            background: #222;

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

        }


        .login-button:active {

            transform: scale(0.98);

        }


        .back-button {

            width: 100%;

            padding: 14px;

            margin-top: 10px;

            border: none;

            border-radius: 10px;

            background: #eee;

            color: #333;

            font-size: 16px;

            cursor: pointer;

        }


        .error {

            display: none;

            margin-top: 15px;

            padding: 12px;

            background: #f8d7da;

            color: #842029;

            border-radius: 8px;

            text-align: center;

            font-size: 14px;

        }

    </style>

</head>


<body>


<div class="login-box">


    <div class="login-title">

        <div class="icon">
            🔐
        </div>

        <h1>
            관리자 로그인
        </h1>

        <p>
            관리자 계정으로 로그인해주세요.
        </p>

    </div>



    <form
        id="loginForm">


        <div class="input-group">

            <label for="username">
                아이디
            </label>

            <input
                type="text"
                id="username"
                placeholder="아이디 입력"
                autocomplete="username"
                required>

        </div>



        <div class="input-group">

            <label for="password">
                비밀번호
            </label>

            <input
                type="password"
                id="password"
                placeholder="비밀번호 입력"
                autocomplete="current-password"
                required>

        </div>



        <button
            type="submit"
            class="login-button">

            로그인

        </button>


    </form>



    <button
        class="back-button"
        onclick="location.href='index.html'">

        처음으로

    </button>



    <div
        id="errorMessage"
        class="error">

        아이디 또는 비밀번호가 올바르지 않습니다.

    </div>


</div>



<script>


    /* ========================================
       관리자 계정
       
       테스트용 계정입니다.
    ======================================== */

    const ADMIN_ID =
        "admin";


    const ADMIN_PASSWORD =
        "1234";



    /* ========================================
       로그인
    ======================================== */

    document
        .getElementById("loginForm")
        .addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const username =
                    document
                        .getElementById(
                            "username"
                        )
                        .value
                        .trim();


                const password =
                    document
                        .getElementById(
                            "password"
                        )
                        .value;



                /* 로그인 확인 */

                if (
                    username === ADMIN_ID &&
                    password === ADMIN_PASSWORD
                ) {


                    /*
                     * 관리자 로그인 상태 저장
                     *
                     * admin.html에서
                     * 이 값을 확인할 수 있습니다.
                     */

                    sessionStorage.setItem(
                        "adminLoggedIn",
                        "true"
                    );


                    /* 관리자 페이지 이동 */

                    location.href =
                        "admin.html";

                }

                else {


                    document
                        .getElementById(
                            "errorMessage"
                        )
                        .style.display =
                        "block";

                }

            }
        );


</script>


</body>

</html>
