<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Firebase 테스트</title>
</head>

<body>

<h1>Firebase 연결 테스트</h1>

<button id="saveBtn">데이터 저장</button>
<button id="loadBtn">데이터 불러오기</button>

<script type="module">

    // Firebase
    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    // Firestore
    import {
        getFirestore,
        collection,
        addDoc,
        getDocs
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    // =========================
    // Firebase 설정
    // =========================

    const firebaseConfig = {
  authDomain: "studio-4659441404-b129a.firebaseapp.com",
  projectId: "studio-4659441404-b129a",
  storageBucket: "studio-4659441404-b129a.firebasestorage.app",
  messagingSenderId: "126559177104",
  appId: "1:126559177104:web:907db9ca93560988468b15"
    };


    // Firebase 초기화
    const app = initializeApp(firebaseConfig);

    // Firestore 연결
    const db = getFirestore(app);


    // =========================
    // 데이터 저장
    // =========================

    document.getElementById("saveBtn").addEventListener("click", async () => {

        try {

            const docRef = await addDoc(
                collection(db, "test_userlist"),
                {
                    user: "hong123",
                    name: "홍길동",
                    pw: "1234"
                }
            );

            console.log("저장 성공:", docRef.id);

            alert("저장 성공!");

        } catch (error) {

            console.error("저장 실패:", error);

            alert("저장 실패\n" + error.message);
        }

    });


    // =========================
    // 데이터 불러오기
    // =========================

    document.getElementById("loadBtn").addEventListener("click", async () => {

        try {

            const querySnapshot =
                await getDocs(collection(db, "test_userlist"));

            querySnapshot.forEach((doc) => {

                console.log(
                    doc.id,
                    doc.data()
                );

            });

            alert("콘솔을 확인하세요.");

        } catch (error) {

            console.error("불러오기 실패:", error);

        }

    });

</script>

</body>
</html>
