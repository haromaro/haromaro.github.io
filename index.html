<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>태블릿 메뉴판</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Noto Sans KR",
                "Malgun Gothic",
                sans-serif;

            background: #f5f6f8;
            color: #222;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        /* 전체 화면 */
        .container {
            width: 100%;
            max-width: 1000px;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            padding: 50px;
        }

        /* 상단 제목 */
        .header {
            text-align: center;
            margin-bottom: 60px;
        }

        .header h1 {
            font-size: clamp(36px, 6vw, 64px);
            font-weight: 700;
            letter-spacing: -2px;
            margin-bottom: 15px;
        }

        .header p {
            font-size: clamp(16px, 2.5vw, 24px);
            color: #777;
        }

        /* 버튼 영역 */
        .menu {
            width: 100%;

            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 30px;
        }

        /* 버튼 */
        .menu-button {
            min-height: 300px;

            border: none;
            border-radius: 30px;

            cursor: pointer;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }

        .menu-button:hover {
            transform: translateY(-5px);
        }

        .menu-button:active {
            transform: scale(0.97);
        }

        /* 아이콘 */
        .icon {
            font-size: 80px;
            margin-bottom: 25px;
        }

        /* 버튼 제목 */
        .button-title {
            font-size: clamp(28px, 4vw, 42px);
            font-weight: 700;
            margin-bottom: 10px;
        }

        /* 버튼 설명 */
        .button-description {
            font-size: clamp(15px, 2vw, 20px);
            opacity: 0.7;
        }

        /* 주문하기 */
        .order {
            background: #222;
            color: white;

            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        /* 관리하기 */
        .admin {
            background: white;
            color: #222;

            border: 2px solid #e5e5e5;

            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
        }

        /* 태블릿 세로 화면 */
        @media (max-width: 700px) {

            .container {
                padding: 30px;
            }

            .header {
                margin-bottom: 40px;
            }

            .menu {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .menu-button {
                min-height: 220px;
            }

            .icon {
                font-size: 60px;
                margin-bottom: 15px;
            }
        }

        /* 작은 화면 */
        @media (max-height: 700px) {

            .header {
                margin-bottom: 30px;
            }

            .menu-button {
                min-height: 200px;
            }

            .icon {
                font-size: 50px;
                margin-bottom: 10px;
            }
        }

    </style>
</head>

<body>

    <main class="container">

        <!-- 제목 -->
        <header class="header">
            <h1>메뉴판</h1>
            <p>원하시는 서비스를 선택해주세요.</p>
        </header>


        <!-- 메뉴 -->
        <section class="menu">

            <!-- 주문하기 -->
            <button
                class="menu-button order"
                onclick="location.href='kiosk.html'">

                <div class="icon">🛒</div>

                <div class="button-title">
                    주문하기
                </div>

                <div class="button-description">
                    메뉴를 선택하고 주문합니다.
                </div>

            </button>


            <!-- 관리하기 -->
            <button
                class="menu-button admin"
                onclick="location.href='admin-login.html'">

                <div class="icon">⚙️</div>

                <div class="button-title">
                    관리하기
                </div>

                <div class="button-description">
                    관리자 페이지로 이동합니다.
                </div>

            </button>

        </section>

    </main>

</body>
</html>
