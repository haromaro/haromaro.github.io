<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple 3D FPS</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; overflow:hidden; background:#000; font-family:Arial,sans-serif; }
  #ui { position:fixed; inset:0; pointer-events:none; color:white; }
  #crosshair { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-size:34px; }
  #hud { position:absolute; left:20px; top:18px; font-size:20px; text-shadow:0 2px 3px #000; }
  #message {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.55); pointer-events:auto; text-align:center;
  }
  #panel { background:rgba(20,20,20,.9); padding:32px 45px; border:1px solid #777; border-radius:12px; }
  button { font-size:20px; padding:12px 28px; cursor:pointer; }
</style>
</head>
<body>
<div id="ui">
  <div id="hud">점수: <span id="score">0</span> &nbsp; 체력: <span id="health">100</span></div>
  <div id="crosshair">+</div>
  <div id="message"><div id="panel"><h1>Simple 3D FPS</h1><p>WASD: 이동<br>마우스: 시점<br>클릭: 발사</p><button id="start">게임 시작</button></div></div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b7df);
scene.fog = new THREE.Fog(0x87b7df, 25, 100);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 1.7, 8);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 2));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(10,20,10);
scene.add(sun);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(200,200),
  new THREE.MeshStandardMaterial({color:0x4d7d42})
);
floor.rotation.x = -Math.PI/2;
scene.add(floor);

const walls = [];
function wall(x,z,w,d) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,5,d),
    new THREE.MeshStandardMaterial({color:0x888888}));
  m.position.set(x,2.5,z); scene.add(m); walls.push(m);
}
wall(0,-30,60,1); wall(0,30,60,1); wall(-30,0,1,60); wall(30,0,1,60);
for(let i=0;i<12;i++) wall((Math.random()-.5)*45,(Math.random()-.5)*45,3+Math.random()*5,3+Math.random()*5);

const enemies = [];
function spawnEnemy() {
  const e = new THREE.Mesh(
    new THREE.BoxGeometry(1.4,2.4,1.4),
    new THREE.MeshStandardMaterial({color:0xc62828})
  );
  let x,z;
  do { x=(Math.random()-.5)*48; z=(Math.random()-.5)*48; }
  while(Math.hypot(x-camera.position.x,z-camera.position.z)<10);
  e.position.set(x,1.2,z);
  e.userData.hp=2;
  scene.add(e); enemies.push(e);
}
for(let i=0;i<12;i++) spawnEnemy();

const keys = {};
let yaw=0, pitch=0, locked=false, score=0, health=100, lastShot=0;
const scoreEl=document.getElementById('score'), healthEl=document.getElementById('health');
const message=document.getElementById('message');
document.getElementById('start').onclick=()=>renderer.domElement.requestPointerLock();

renderer.domElement.addEventListener('click',()=>{
  if(!locked) return;
  const now=performance.now();
  if(now-lastShot<180) return;
  lastShot=now;
  const ray=new THREE.Raycaster();
  ray.setFromCamera(new THREE.Vector2(0,0),camera);
  const hit=ray.intersectObjects(enemies,false)[0];
  if(hit) {
    const e=hit.object; e.userData.hp--;
    e.material.emissive.setHex(0x550000);
    setTimeout(()=>e.material.emissive.setHex(0x000000),70);
    if(e.userData.hp<=0) {
      scene.remove(e); enemies.splice(enemies.indexOf(e),1);
      score+=100; scoreEl.textContent=score;
      spawnEnemy();
    }
  }
});

document.addEventListener('pointerlockchange',()=>{
  locked=document.pointerLockElement===renderer.domElement;
  message.style.display=locked?'none':'flex';
});
document.addEventListener('mousemove',e=>{
  if(!locked) return;
  yaw-=e.movementX*0.0025;
  pitch-=e.movementY*0.0025;
  pitch=Math.max(-1.5,Math.min(1.5,pitch));
  camera.rotation.set(pitch,yaw,0,'YXZ');
});
document.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

const clock=new THREE.Clock();
function update(dt) {
  if(!locked || health<=0) return;
  const speed=9;
  const forward=new THREE.Vector3(Math.sin(yaw),0,-Math.cos(yaw));
  const right=new THREE.Vector3(Math.cos(yaw),0,Math.sin(yaw));
  const move=new THREE.Vector3();
  if(keys.w) move.add(forward);
  if(keys.s) move.sub(forward);
  if(keys.d) move.add(right);
  if(keys.a) move.sub(right);
  if(move.lengthSq()) {
    move.normalize().multiplyScalar(speed*dt);
    const next=camera.position.clone().add(move);
    next.x=Math.max(-28,Math.min(28,next.x));
    next.z=Math.max(-28,Math.min(28,next.z));
    camera.position.copy(next);
  }
  for(const e of enemies) {
    const dir=new THREE.Vector3().subVectors(camera.position,e.position);
    dir.y=0;
    const dist=dir.length();
    if(dist>1.8) {
      dir.normalize();
      e.position.addScaledVector(dir,2.2*dt);
      e.lookAt(camera.position.x,e.position.y,camera.position.z);
    } else {
      health-=18*dt; health=Math.max(0,health);
      healthEl.textContent=Math.ceil(health);
      if(health<=0) {
        document.getElementById('panel').innerHTML='<h1>GAME OVER</h1><p>점수: '+score+'</p><button id="restart">다시 시작</button>';
        message.style.display='flex';
        if(document.pointerLockElement) document.exitPointerLock();
        document.getElementById('restart').onclick=()=>location.reload();
      }
    }
  }
}
function loop() {
  requestAnimationFrame(loop);
  update(Math.min(clock.getDelta(),0.05));
  renderer.render(scene,camera);
}
loop();
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
