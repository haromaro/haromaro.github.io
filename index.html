<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Firebase 테스트</title>
</head>

<body>

    <h1>Firebase 연결 테스트</h1>

    <hr>

    <h2>사용자 등록</h2>

    <input
        type="text"
        id="idInput"
        placeholder="아이디"
    >

    <br><br>

    <input
        type="text"
        id="userInput"
        placeholder="이름"
    >

    <br><br>

    <input
        type="password"
        id="pwInput"
        placeholder="비밀번호"
    >

    <br><br>

    <button id="saveBtn">
        데이터 저장
    </button>

    <hr>

    <h2>사용자 목록</h2>

    <button id="loadBtn">
        데이터 불러오기
    </button>

    <div id="result"></div>


    <script type="module">

        // ==================================================
        // Firebase SDK
        // ==================================================

        import { initializeApp }
            from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

        import {
            getFirestore,
            collection,
            addDoc,
            getDocs
        }
        from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


        // ==================================================
        // Firebase 설정
        // ==================================================

const firebaseConfig = {
  apiKey: "AIzaSyBu1f_9ZH20urzVju4lh_9DGP_4qwUY9nU",
  authDomain: "fir-test2-72692.firebaseapp.com",
  projectId: "fir-test2-72692",
  storageBucket: "fir-test2-72692.firebasestorage.app",
  messagingSenderId: "606077351717",
  appId: "1:606077351717:web:dc82bd34ebc78883570ccc"
};


        // ==================================================
        // Firebase 초기화
        // ==================================================

        const app = initializeApp(firebaseConfig);


        // ==================================================
        // Firestore 연결
        // ==================================================

        const db = getFirestore(app);


        // ==================================================
        // 사용할 컬렉션
        // ==================================================

        const userCollection =
            collection(db, "test_num1");


        // ==================================================
        // 데이터 저장
        // ==================================================

        document
            .getElementById("saveBtn")
            .addEventListener("click", async () => {

                try {

                    // 입력값 가져오기
                    const id =
                        document
                            .getElementById("idInput")
                            .value;

                    const user =
                        document
                            .getElementById("userInput")
                            .value;

                    const pw =
                        document
                            .getElementById("pwInput")
                            .value;


                    // 빈 값 확인
                    if (!id || !user || !pw) {

                        alert("모든 항목을 입력하세요.");

                        return;
                    }


                    // Firestore에 저장
                    const docRef = await addDoc(
                        userCollection,
                        {
                            id: id,
                            pw: pw,
                            user: user
                        }
                    );


                    console.log(
                        "저장 성공",
                        docRef.id
                    );


                    alert(
                        "저장되었습니다.\n\n" +
                        "문서 ID: " +
                        docRef.id
                    );


                    // 입력창 초기화
                    document
                        .getElementById("idInput")
                        .value = "";

                    document
                        .getElementById("userInput")
                        .value = "";

                    document
                        .getElementById("pwInput")
                        .value = "";

                }

                catch (error) {

                    console.error(
                        "저장 실패:",
                        error
                    );

                    alert(
                        "저장 실패\n\n" +
                        error.message
                    );
                }

            });


        // ==================================================
        // 데이터 불러오기
        // ==================================================

        document
            .getElementById("loadBtn")
            .addEventListener("click", async () => {

                try {

                    // test_num1 컬렉션의 모든 문서 가져오기
                    const snapshot =
                        await getDocs(userCollection);


                    console.log(
                        "===== 사용자 목록 ====="
                    );


                    // 화면 초기화
                    const result =
                        document.getElementById("result");

                    result.innerHTML = "";


                    // 문서 반복
                    snapshot.forEach((doc) => {

                        const data =
                            doc.data();


                        // 콘솔 출력
                        console.log(
                            "문서 ID:",
                            doc.id
                        );

                        console.log(
                            "id:",
                            data.id
                        );

                        console.log(
                            "user:",
                            data.user
                        );

                        console.log(
                            "pw:",
                            data.pw
                        );


                        // 화면 출력
                        const div =
                            document.createElement("div");

                        div.innerHTML = `
                            <hr>
                            <p>문서 ID: ${doc.id}</p>
                            <p>아이디: ${data.id}</p>
                            <p>이름: ${data.user}</p>
                            <p>비밀번호: ${data.pw}</p>
                        `;

                        result.appendChild(div);

                    });


                    console.log(
                        "총 문서 수:",
                        snapshot.size
                    );


                    if (snapshot.empty) {

                        result.innerHTML =
                            "<p>등록된 사용자가 없습니다.</p>";

                    }

                }

                catch (error) {

                    console.error(
                        "불러오기 실패:",
                        error
                    );

                    alert(
                        "불러오기 실패\n\n" +
                        error.message
                    );
                }

            });

    </script>

</body>

</html>
